<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>E-Paper Studio (200x200)</title>
  <style>
    :root {
      --eink-bg: #ffffff;
      --eink-black: #111111;
      --eink-red: #d32f2f;
      --eink-yellow: #fbc02d;
    }

    * {
      box-sizing: border-box;
      touch-action: manipulation;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: #1a1a20;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 1rem;
      margin-bottom: 10px;
      color: #888899;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .canvas-container {
      position: relative;
      width: 256px;
      height: 256px;
      background: #2a2a32;
      border: 3px solid #444452;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      touch-action: none;
    }

    /* Superposición de capas */
    .canvas-wrapper {
      position: relative;
      width: 250px;
      height: 250px;
      background-color: var(--eink-bg);
      border: 1px dashed #666;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 250px;
      height: 250px;
      image-rendering: pixelated;
    }

    #bgCanvas {
      z-index: 1;
    }

    #drawCanvas {
      z-index: 2;
    }

    .mode-selector {
      display: flex;
      gap: 6px;
      margin-top: 14px;
      width: 100%;
      max-width: 300px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      background: #2a2a32;
      border: 1px solid #444452;
      color: #aaa;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #4f46e5;
      color: #fff;
      border-color: #6366f1;
    }

    .panel {
      display: none;
      width: 100%;
      max-width: 300px;
      margin-top: 12px;
      background: #2a2a32;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #3f3f4e;
    }

    .panel.active {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .palette {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .color-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid #555;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      background: #2a2a32;
    }

    .color-btn.selected {
      border-color: #fff;
      transform: scale(1.15);
    }

    textarea, input[type="file"], select {
      width: 100%;
      padding: 8px;
      background: #1e1e24;
      border: 1px solid #444452;
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      resize: none;
    }

    .range-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
    }

    .action-group {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 300px;
      margin-top: 14px;
    }

    .btn-action {
      flex: 1;
      padding: 12px 0;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-undo { background: #d97706; color: white; }
    .btn-clear { background: #e11d48; color: white; }
    .btn-send { background: #10b981; color: white; }
    .btn-stamp { background: #6366f1; color: white; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <h1>Canvas E-Paper (200x200)</h1>

  <div class="canvas-container">
    <div class="canvas-wrapper">
      <canvas id="bgCanvas" width="200" height="200"></canvas>
      <canvas id="drawCanvas" width="200" height="200"></canvas>
    </div>
  </div>

  <div class="mode-selector">
    <button class="tab-btn active" onclick="setMode('draw')">🎨 Dibujar</button>
    <button class="tab-btn" onclick="setMode('photo')">📷 Foto</button>
    <button class="tab-btn" onclick="setMode('text')">📝 Texto</button>
  </div>

  <div id="panel-draw" class="panel active">
    <div class="palette">
      <div class="color-btn selected" style="background: var(--eink-black);" onclick="setColor('#111111', this)"></div>
      <div class="color-btn" style="background: var(--eink-red);" onclick="setColor('#d32f2f', this)"></div>
      <div class="color-btn" style="background: var(--eink-yellow);" onclick="setColor('#fbc02d', this)"></div>
      <div class="color-btn" style="background: #ffffff;" onclick="setColor('#ffffff', this)"></div>
      <div class="color-btn" style="background: #3f3f4e; color: #fff;" onclick="setEraser(this)" title="Borrador de pintura">🧹</div>
    </div>
    <div class="range-group">
      <label for="brushSize">Grosor:</label>
      <input type="range" id="brushSize" min="1" max="12" value="2" style="flex:1;">
    </div>
  </div>

  <div id="panel-photo" class="panel">
    <input type="file" id="imageInput" accept="image/*">
    <button class="tab-btn" onclick="processImageToDitheredGrayscale()">Aplicar Filtro E-Ink (Grises)</button>
  </div>

  <div id="panel-text" class="panel">
    <textarea id="textInput" rows="2" placeholder="Escribe tu nota aquí... (Enter para salto)"></textarea>
    
    <div class="range-group">
      <label for="textColor">Color:</label>
      <select id="textColor" onchange="redrawWithTextPreview()">
        <option value="#111111">Negro</option>
        <option value="#d32f2f">Rojo</option>
        <option value="#fbc02d">Amarillo</option>
      </select>
    </div>

    <div class="range-group">
      <label for="textFont">Fuente:</label>
      <select id="textFont" onchange="redrawWithTextPreview()">
        <option value="sans-serif">Normal (Sans-Serif)</option>
        <option value="serif">Elegante (Serif)</option>
        <option value="monospace">Retro / Pixel (Monospace)</option>
        <option value="cursive">Manuscrita (Cursive)</option>
      </select>
    </div>

    <p style="font-size: 0.75rem; color: #aaa; margin: 0; line-height: 1.3;">
      👉 <b>1 Dedo:</b> Mover posición.<br>
      👉 <b>2 Dedos:</b> Pellizcar para tamaño / Girar para rotar.
    </p>
    <button class="btn-stamp" onclick="stampText()">📌 Fijar Texto en Fondo</button>
  </div>

  <div class="action-group">
    <button class="btn-action btn-undo" onclick="undoLastAction()">↩️ Deshacer</button>
    <button class="btn-action btn-clear" onclick="clearCanvas()">🗑️ Limpiar</button>
    <button class="btn-action btn-send" onclick="sendToEpaper()">🚀 Enviar</button>
  </div>

  <script>
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d', { willReadFrequently: true });

    const drawCanvas = document.getElementById('drawCanvas');
    const drawCtx = drawCanvas.getContext('2d', { willReadFrequently: true });

    let isDrawing = false;
    let currentColor = '#111111';
    let isEraserMode = false;
    let currentMode = 'draw';

    let historyStack = [];
    const MAX_HISTORY = 10;

    // Estado de Texto
    let floatingText = "";
    let textState = { x: 100, y: 100, size: 18, angle: 0 };

    // Gestos
    let touchStartDist = 0;
    let touchStartAngle = 0;
    let initialSize = 18;
    let initialAngle = 0;

    // Inicializar Fondo Blanco
    bgCtx.fillStyle = '#ffffff';
    bgCtx.fillRect(0, 0, 200, 200);
    saveState();

    function saveState() {
      if (historyStack.length >= MAX_HISTORY) historyStack.shift();
      // Guardamos capturas de ambas capas
      historyStack.push({
        bg: bgCtx.getImageData(0, 0, 200, 200),
        draw: drawCtx.getImageData(0, 0, 200, 200)
      });
    }

    function undoLastAction() {
      if (historyStack.length > 1) {
        historyStack.pop();
        const previousState = historyStack[historyStack.length - 1];
        bgCtx.putImageData(previousState.bg, 0, 0);
        drawCtx.putImageData(previousState.draw, 0, 0);
      } else if (historyStack.length === 1) {
        clearCanvas();
      }
    }

    function clearCanvas() {
      bgCtx.fillStyle = '#ffffff';
      bgCtx.fillRect(0, 0, 200, 200);
      drawCtx.clearRect(0, 0, 200, 200);
      historyStack = [];
      saveState();
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

      if (mode === 'draw') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('panel-draw').classList.add('active');
      } else if (mode === 'photo') {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('panel-photo').classList.add('active');
      } else if (mode === 'text') {
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
        document.getElementById('panel-text').classList.add('active');
      }
      redrawWithTextPreview();
    }

    function setColor(color, element) {
      currentColor = color;
      isEraserMode = false;
      document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('selected'));
      element.classList.add('selected');
    }

    function setEraser(element) {
      isEraserMode = true;
      document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('selected'));
      element.classList.add('selected');
    }

    function getCanvasCoords(clientX, clientY) {
      const rect = drawCanvas.getBoundingClientRect();
      return {
        x: (clientX - rect.left) * (200 / rect.width),
        y: (clientY - rect.top) * (200 / rect.height)
      };
    }

    function getTouchDistance(t1, t2) {
      const dx = t1.clientX - t2.clientX;
      const dy = t1.clientY - t2.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function getTouchAngle(t1, t2) {
      return Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX);
    }

    function startStroke(x, y) {
      drawCtx.beginPath();
      drawCtx.moveTo(x, y);
      drawCtx.lineWidth = document.getElementById('brushSize').value;
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';

      if (isEraserMode) {
        // Borra SOLO en la capa de dibujo haciéndola transparente de nuevo
        drawCtx.globalCompositeOperation = 'destination-out';
      } else {
        drawCtx.globalCompositeOperation = 'source-over';
        drawCtx.strokeStyle = currentColor;
      }
    }

    function drawStroke(x, y) {
      drawCtx.lineTo(x, y);
      drawCtx.stroke();
    }

    function handleTouchStart(e) {
      if (currentMode === 'draw') {
        isDrawing = true;
        const coords = getCanvasCoords(e.touches[0].clientX, e.touches[0].clientY);
        startStroke(coords.x, coords.y);
      } else if (currentMode === 'text') {
        if (e.touches.length === 1) {
          const coords = getCanvasCoords(e.touches[0].clientX, e.touches[0].clientY);
          textState.x = coords.x;
          textState.y = coords.y;
        } else if (e.touches.length === 2) {
          touchStartDist = getTouchDistance(e.touches[0], e.touches[1]);
          touchStartAngle = getTouchAngle(e.touches[0], e.touches[1]);
          initialSize = textState.size;
          initialAngle = textState.angle;
        }
        redrawWithTextPreview();
      }
    }

    function handleTouchMove(e) {
      if (currentMode === 'draw' && isDrawing) {
        e.preventDefault();
        const coords = getCanvasCoords(e.touches[0].clientX, e.touches[0].clientY);
        drawStroke(coords.x, coords.y);
      } else if (currentMode === 'text') {
        e.preventDefault();
        if (e.touches.length === 1) {
          const coords = getCanvasCoords(e.touches[0].clientX, e.touches[0].clientY);
          textState.x = coords.x;
          textState.y = coords.y;
        } else if (e.touches.length === 2) {
          const currentDist = getTouchDistance(e.touches[0], e.touches[1]);
          if (touchStartDist > 0) {
            const scale = currentDist / touchStartDist;
            textState.size = Math.min(Math.max(initialSize * scale, 10), 60);
          }
          const currentAngle = getTouchAngle(e.touches[0], e.touches[1]);
          textState.angle = initialAngle + (currentAngle - touchStartAngle);
        }
        redrawWithTextPreview();
      }
    }

    function handleTouchEnd() {
      if (isDrawing) {
        isDrawing = false;
        drawCtx.globalCompositeOperation = 'source-over';
        saveState();
      }
    }

    drawCanvas.addEventListener('touchstart', handleTouchStart, {passive: false});
    drawCanvas.addEventListener('touchmove', handleTouchMove, {passive: false});
    drawCanvas.addEventListener('touchend', handleTouchEnd);

    drawCanvas.addEventListener('mousedown', (e) => {
      if (currentMode === 'draw') {
        isDrawing = true;
        const coords = getCanvasCoords(e.clientX, e.clientY);
        startStroke(coords.x, coords.y);
      } else if (currentMode === 'text') {
        const coords = getCanvasCoords(e.clientX, e.clientY);
        textState.x = coords.x;
        textState.y = coords.y;
        redrawWithTextPreview();
      }
    });

    drawCanvas.addEventListener('mousemove', (e) => {
      if (isDrawing && currentMode === 'draw') {
        const coords = getCanvasCoords(e.clientX, e.clientY);
        drawStroke(coords.x, coords.y);
      }
    });

    drawCanvas.addEventListener('mouseup', () => { 
      if (isDrawing) { 
        isDrawing = false; 
        drawCtx.globalCompositeOperation = 'source-over';
        saveState(); 
      } 
    });

    document.getElementById('textInput').addEventListener('input', function() {
      floatingText = this.value;
      redrawWithTextPreview();
    });

    function renderRotatedText(targetCtx, text) {
      const color = document.getElementById('textColor').value;
      const font = document.getElementById('textFont').value;

      targetCtx.save();
      targetCtx.translate(textState.x, textState.y);
      targetCtx.rotate(textState.angle);

      targetCtx.fillStyle = color;
      targetCtx.font = `bold ${textState.size}px ${font}`;
      targetCtx.textAlign = 'center';
      targetCtx.textBaseline = 'middle';

      const paragraphs = text.split('\n');
      const lineHeight = textState.size * 1.2;
      const startY = -((paragraphs.length - 1) * lineHeight) / 2;

      paragraphs.forEach((p, idx) => {
        targetCtx.fillText(p, 0, startY + (idx * lineHeight));
      });

      targetCtx.restore();
    }

    function redrawWithTextPreview() {
      if (historyStack.length > 0) {
        const state = historyStack[historyStack.length - 1];
        bgCtx.putImageData(state.bg, 0, 0);
      }
      if (currentMode === 'text' && floatingText.trim() !== '') {
        renderRotatedText(bgCtx, floatingText);
      }
    }

    function stampText() {
      if (!floatingText.trim()) return;
      redrawWithTextPreview();
      saveState();
      document.getElementById('textInput').value = '';
      floatingText = '';
      alert("¡Texto fijado en el lienzo!");
    }

    // Cargar fotos en la capa de FONDO
    document.getElementById('imageInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          bgCtx.drawImage(img, 0, 0, 200, 200);
          saveState();
        }
        img.src = event.target.result;
      }
      reader.readAsDataURL(file);
    });

    function processImageToDitheredGrayscale() {
      const imgData = bgCtx.getImageData(0, 0, 200, 200);
      const data = imgData.data;
      const width = 200;
      const height = 200;

      let gray = new Float32Array(width * height);
      for (let i = 0; i < data.length; i += 4) {
        gray[i / 4] = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
      }

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          let idx = y * width + x;
          let oldPixel = gray[idx];
          let newPixel = oldPixel < 128 ? 0 : 255;
          gray[idx] = newPixel;
          let quantError = oldPixel - newPixel;

          if (x + 1 < width) gray[idx + 1] += quantError * (7 / 16);
          if (x - 1 >= 0 && y + 1 < height) gray[idx + width - 1] += quantError * (3 / 16);
          if (y + 1 < height) gray[idx + width] += quantError * (5 / 16);
          if (x + 1 < width && y + 1 < height) gray[idx + width + 1] += quantError * (1 / 16);
        }
      }

      for (let i = 0; i < gray.length; i++) {
        let val = gray[i];
        let pixelIdx = i * 4;
        data[pixelIdx] = val;
        data[pixelIdx+1] = val;
        data[pixelIdx+2] = val;
      }

      bgCtx.putImageData(imgData, 0, 0);
      saveState();
    }

    function sendToEpaper() {
      // Unificar ambas capas para exportar el resultado final
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = 200;
      exportCanvas.height = 200;
      const exportCtx = exportCanvas.getContext('2d');

      exportCtx.drawImage(bgCanvas, 0, 0);
      exportCtx.drawImage(drawCanvas, 0, 0);

      alert("¡Diseño unificado y listo para enviar!");
    }
  </script>
</body>
</html>
