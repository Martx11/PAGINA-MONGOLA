<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>E-Paper Studio (200x200)</title>
  <style>
    :root {
      --eink-bg: #ffffff;
      --eink-black: #111111;
      --eink-red: #d32f2f;
      --eink-yellow: #fbc02d;
    }

    * {
      box-sizing: border-box;
      touch-action: manipulation;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: #1a1a20;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 1rem;
      margin-bottom: 10px;
      color: #888899;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Contenedor del Canvas */
    .canvas-container {
      position: relative;
      width: 270px;
      height: 270px;
      background: #2a2a32;
      border: 3px solid #444452;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      touch-action: none;
    }

    canvas {
      width: 250px;
      height: 250px;
      image-rendering: pixelated;
      background-color: var(--eink-bg);
      border: 1px dashed #666;
    }

    /* Selector de Modos */
    .mode-selector {
      display: flex;
      gap: 6px;
      margin-top: 14px;
      width: 100%;
      max-width: 300px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      background: #2a2a32;
      border: 1px solid #444452;
      color: #aaa;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #4f46e5;
      color: #fff;
      border-color: #6366f1;
    }

    /* Paneles de Herramientas */
    .panel {
      display: none;
      width: 100%;
      max-width: 300px;
      margin-top: 12px;
      background: #2a2a32;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #3f3f4e;
    }

    .panel.active {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Paleta de Colores */
    .palette {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .color-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid #555;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .color-btn.selected {
      border-color: #fff;
      transform: scale(1.15);
    }

    /* Controles de Entrada */
    textarea, input[type="file"], select {
      width: 100%;
      padding: 8px;
      background: #1e1e24;
      border: 1px solid #444452;
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      resize: none;
    }

    .range-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
    }

    /* Botones de Acción Principal */
    .action-group {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 300px;
      margin-top: 14px;
    }

    .btn-action {
      flex: 1;
      padding: 12px 0;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-undo { background: #d97706; color: white; }
    .btn-clear { background: #e11d48; color: white; }
    .btn-send { background: #10b981; color: white; }
    .btn-stamp { background: #6366f1; color: white; padding: 8px; border: none; border-radius: 6px; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Canvas E-Paper (200x200)</h1>

  <div class="canvas-container">
    <canvas id="einkCanvas" width="200" height="200"></canvas>
  </div>

  <!-- Selector de Modos -->
  <div class="mode-selector">
    <button class="tab-btn active" onclick="setMode('draw')">🎨 Dibujar</button>
    <button class="tab-btn" onclick="setMode('photo')">📷 Foto</button>
    <button class="tab-btn" onclick="setMode('text')">📝 Texto</button>
  </div>

  <!-- Panel 1: Dibujo -->
  <div id="panel-draw" class="panel active">
    <div class="palette">
      <div class="color-btn selected" style="background: var(--eink-black);" onclick="setColor('#111111', this)"></div>
      <div class="color-btn" style="background: var(--eink-red);" onclick="setColor('#d32f2f', this)"></div>
      <div class="color-btn" style="background: var(--eink-yellow);" onclick="setColor('#fbc02d', this)"></div>
      <div class="color-btn" style="background: #ffffff; color: #000;" onclick="setColor('#ffffff', this)" title="Goma">🧹</div>
    </div>
    <div class="range-group">
      <label>Grosor:</label>
      <input type="range" id="brushSize" min="1" max="12" value="2" style="flex:1;">
    </div>
  </div>

  <!-- Panel 2: Foto -->
  <div id="panel-photo" class="panel">
    <input type="file" id="imageInput" accept="image/*">
    <button class="tab-btn" onclick="processImageToDitheredGrayscale()">Aplicar Filtro E-Ink (Grises)</button>
  </div>

  <!-- Panel 3: Texto -->
  <div id="panel-text" class="panel">
    <textarea id="textInput" rows="3" placeholder="Escribe tu nota aquí... (Enter para salto de línea)"></textarea>
    <div class="range-group">
      <label>Color:</label>
      <select id="textColor">
        <option value="#111111">Negro</option>
        <option value="#d32f2f">Rojo</option>
        <option value="#fbc02d">Amarillo</option>
      </select>
    </div>
    <p style="font-size: 0.75rem; color: #aaa; margin: 0;">👉 Arrastra el texto en el lienzo para posicionarlo:</p>
    <button class="btn-stamp" onclick="stampText()">📌 Fijar Texto en Canvas</button>
  </div>

  <!-- Acciones -->
  <div class="action-group">
    <button class="btn-action btn-undo" onclick="undoLastAction()">↩️ Deshacer</button>
    <button class="btn-action btn-clear" onclick="clearCanvas()">🗑️ Limpiar</button>
    <button class="btn-action btn-send" onclick="sendToEpaper()">🚀 Enviar</button>
  </div>

  <script>
    const canvas = document.getElementById('einkCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    let isDrawing = false;
    let isDraggingText = false;
    let currentColor = '#111111';
    let currentMode = 'draw';

    // Historial para Deshacer
    let historyStack = [];
    const MAX_HISTORY = 10;

    // Estado del Texto Flotante
    let floatingText = "";
    let textPos = { x: 100, y: 100 };

    saveState();

    function saveState() {
      if (historyStack.length >= MAX_HISTORY) historyStack.shift();
      historyStack.push(ctx.getImageData(0, 0, 200, 200));
    }

    function undoLastAction() {
      if (historyStack.length > 1) {
        historyStack.pop();
        const previousState = historyStack[historyStack.length - 1];
        ctx.putImageData(previousState, 0, 0);
      } else if (historyStack.length === 1) {
        clearCanvas();
      }
    }

    function clearCanvas() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 200, 200);
      historyStack = [];
      saveState();
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

      if (mode === 'draw') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('panel-draw').classList.add('active');
      } else if (mode === 'photo') {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('panel-photo').classList.add('active');
      } else if (mode === 'text') {
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
        document.getElementById('panel-text').classList.add('active');
      }
      redrawCanvasWithTextPreview();
    }

    function setColor(color, element) {
      currentColor = color;
      document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('selected'));
      element.classList.add('selected');
    }

    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (200 / rect.width),
        y: (clientY - rect.top) * (200 / rect.height)
      };
    }

    function handleStart(e) {
      const coords = getCanvasCoords(e);
      if (currentMode === 'draw') {
        isDrawing = true;
        ctx.beginPath();
        ctx.moveTo(coords.x, coords.y);
      } else if (currentMode === 'text') {
        isDraggingText = true;
        textPos.x = coords.x;
        textPos.y = coords.y;
        redrawCanvasWithTextPreview();
      }
    }

    function handleMove(e) {
      const coords = getCanvasCoords(e);
      if (currentMode === 'draw' && isDrawing) {
        e.preventDefault();
        const size = document.getElementById('brushSize').value;
        ctx.lineTo(coords.x, coords.y);
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = size;
        ctx.lineCap = 'round';
        ctx.stroke();
      } else if (currentMode === 'text' && isDraggingText) {
        e.preventDefault();
        textPos.x = coords.x;
        textPos.y = coords.y;
        redrawCanvasWithTextPreview();
      }
    }

    function handleEnd() {
      if (isDrawing) {
        isDrawing = false;
        saveState();
      }
      isDraggingText = false;
    }

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('mouseup', handleEnd);

    canvas.addEventListener('touchstart', handleStart, {passive: false});
    canvas.addEventListener('touchmove', handleMove, {passive: false});
    canvas.addEventListener('touchend', handleEnd);

    document.getElementById('textInput').addEventListener('input', function() {
      floatingText = this.value;
      redrawCanvasWithTextPreview();
    });

    function renderWrappedText(targetCtx, text, x, y, maxWidth, lineHeight) {
      const color = document.getElementById('textColor').value;
      targetCtx.fillStyle = color;
      targetCtx.font = 'bold 14px sans-serif';
      targetCtx.textAlign = 'center';

      const paragraphs = text.split('\n');
      let currentY = y;

      paragraphs.forEach(paragraph => {
        const words = paragraph.split(' ');
        let line = '';

        for (let n = 0; n < words.length; n++) {
          let testLine = line + words[n] + ' ';
          let metrics = targetCtx.measureText(testLine);
          if (metrics.width > maxWidth && n > 0) {
            targetCtx.fillText(line, x, currentY);
            line = words[n] + ' ';
            currentY += lineHeight;
          } else {
            line = testLine;
          }
        }
        targetCtx.fillText(line, x, currentY);
        currentY += lineHeight;
      });
    }

    function redrawCanvasWithTextPreview() {
      if (historyStack.length > 0) {
        ctx.putImageData(historyStack[historyStack.length - 1], 0, 0);
      }
      if (currentMode === 'text' && floatingText.trim() !== '') {
        renderWrappedText(ctx, floatingText, textPos.x, textPos.y, 180, 18);
      }
    }

    function stampText() {
      if (!floatingText.trim()) return;
      redrawCanvasWithTextPreview();
      saveState();
      document.getElementById('textInput').value = '';
      floatingText = '';
      alert("¡Texto fijado en el lienzo!");
    }

    document.getElementById('imageInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          ctx.drawImage(img, 0, 0, 200, 200);
          saveState();
        }
        img.src = event.target.result;
      }
      reader.readAsDataURL(file);
    });

    // Filtro de Escala de Grises por Dithering (Floyd-Steinberg)
    function processImageToDitheredGrayscale() {
      const imgData = ctx.getImageData(0, 0, 200, 200);
      const data = imgData.data;
      const width = 200;
      const height = 200;

      let gray = new Float32Array(width * height);
      for (let i = 0; i < data.length; i += 4) {
        gray[i / 4] = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
      }

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          let idx = y * width + x;
          let oldPixel = gray[idx];
          let newPixel = oldPixel < 128 ? 0 : 255;
          gray[idx] = newPixel;
          let quantError = oldPixel - newPixel;

          if (x + 1 < width) gray[idx + 1] += quantError * (7 / 16);
          if (x - 1 >= 0 && y + 1 < height) gray[idx + width - 1] += quantError * (3 / 16);
          if (y + 1 < height) gray[idx + width] += quantError * (5 / 16);
          if (x + 1 < width && y + 1 < height) gray[idx + width + 1] += quantError * (1 / 16);
        }
      }

      for (let i = 0; i < gray.length; i++) {
        let val = gray[i];
        let pixelIdx = i * 4;
        data[pixelIdx] = val;
        data[pixelIdx+1] = val;
        data[pixelIdx+2] = val;
      }

      ctx.putImageData(imgData, 0, 0);
      saveState();
    }

    function sendToEpaper() {
      alert("¡Lienzo de 200x200 píxeles listo para enviar a la nube!");
    }
  </script>
</body>
</html>
